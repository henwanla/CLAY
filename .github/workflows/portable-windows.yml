name: Windows CLI and desktop

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      SWIFT_VERSION: '6.4.3'
      # Microsoft WinGet catalog: Swift.Toolchain 6.4.3, x64 installer.
      SWIFT_INSTALLER_SHA256: A4F1369833F77DE28DBAC998C8DEBE1C1D6044410DC6380238AE61A0D7CE5F77
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install the verified swift.org toolchain
        run: |
          $version = $env:SWIFT_VERSION
          $release = "swift-$version-RELEASE"
          $installer = Join-Path $env:RUNNER_TEMP "$release-windows10.exe"
          $url = "https://download.swift.org/swift-$version-release/windows10/$release/$release-windows10.exe"
          curl.exe --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 360 --output $installer $url
          if ($LASTEXITCODE -ne 0) { throw "Swift toolchain download failed: $LASTEXITCODE" }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash -ne $env:SWIFT_INSTALLER_SHA256) {
            throw 'Swift installer checksum does not match the x64 WinGet manifest'
          }
          $log = Join-Path $env:RUNNER_TEMP 'swift-install.log'
          $install = Start-Process -FilePath $installer -ArgumentList @('/install', '/quiet', '/norestart', '/log', ('"' + $log + '"'), 'OptionsInstallDBG=0', 'OptionsInstallPy=0', 'OptionsInstallAndroidPlatform=0') -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) {
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 40 }
            throw "Swift installer failed: $($install.ExitCode)"
          }
          $root = Join-Path $env:LOCALAPPDATA 'Programs\Swift'
          $versionPattern = '^' + [regex]::Escape($version) + '(\+\w+)?$'
          $toolchains = @(Get-ChildItem -LiteralPath (Join-Path $root 'Toolchains') -Directory | Where-Object Name -Match $versionPattern)
          if ($toolchains.Count -ne 1) { throw "Expected one Swift $version toolchain" }
          $bin = Join-Path $toolchains[0].FullName 'usr\bin'
          $runtime = Join-Path $root "Runtimes\$version\usr\bin"
          $sdk = Join-Path $root "Platforms\$version\Windows.platform\Developer\SDKs\Windows.sdk"
          foreach ($path in @((Join-Path $bin 'swift.exe'), (Join-Path $runtime 'swiftCore.dll'), $sdk)) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Swift install is missing: $path" }
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value @($runtime, $bin)
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SDKROOT=$sdk"
      - name: Build portable CLI
        run: |
          $installed = swift --version
          if ($LASTEXITCODE -ne 0) { throw "Swift version check failed: $LASTEXITCODE" }
          $installed
          if (($installed -join " ") -notmatch ("Swift version " + [regex]::Escape($env:SWIFT_VERSION) + "\b")) {
            throw "Expected Swift $env:SWIFT_VERSION"
          }
          swift build -c release --product clay-portable
      - name: Run offline inspection and PAC checks
        run: |
          $buildDir = swift build -c release --show-bin-path
          if ($LASTEXITCODE -ne 0) { throw "Swift binary path lookup failed: $LASTEXITCODE" }
          $binary = Join-Path $buildDir 'clay-portable.exe'
          python scripts/smoke-portable.py $binary --offline-only
      - name: Run native Windows loopback smoke
        run: |
          $buildDir = swift build -c release --show-bin-path
          if ($LASTEXITCODE -ne 0) { throw "Swift binary path lookup failed: $LASTEXITCODE" }
          $binary = Join-Path $buildDir 'clay-portable.exe'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C compiler is missing' }
          & (Join-Path $vs 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $fixture = Join-Path $env:RUNNER_TEMP 'clay-windows-fixture.exe'
          $object = Join-Path $env:RUNNER_TEMP 'clay-windows-fixture.obj'
          cl.exe /nologo /O2 /MT /W4 "/Fe:$fixture" "/Fo:$object" Tests/WindowsRuntimeFixture/fixture.c /link Ws2_32.lib
          if ($LASTEXITCODE -ne 0) { throw "Fixture compilation failed: $LASTEXITCODE" }
          python scripts/smoke-windows-runtime.py $binary $fixture
      - name: Build the desktop app and verify its session bridge
        run: |
          $buildDir = swift build -c release --show-bin-path
          if ($LASTEXITCODE -ne 0) { throw "Swift binary path lookup failed: $LASTEXITCODE" }
          $binary = Join-Path $buildDir 'clay-portable.exe'
          $fixture = Join-Path $env:RUNNER_TEMP 'clay-windows-fixture.exe'
          $desktop = Join-Path $env:RUNNER_TEMP 'clay-desktop-build'
          $name = 'mihomo-windows-amd64-compatible-v1.19.34.zip'
          $engineArchive = Join-Path $env:RUNNER_TEMP $name
          $engineDirectory = Join-Path $env:RUNNER_TEMP 'clay-official-engine'
          curl.exe --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --retry 2 --max-time 90 --output $engineArchive "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/$name"
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash -Algorithm SHA256 -LiteralPath $engineArchive).Hash -ne 'cd6738d4648cc1a5f48049a1343b697ab510889d648f045c5c780fc1ab443a79') {
            throw 'Pinned Mihomo archive failed verification'
          }
          Expand-Archive -LiteralPath $engineArchive -DestinationPath $engineDirectory
          $env:CLAY_OFFICIAL_ENGINE_FIXTURE = Join-Path $engineDirectory 'mihomo-windows-amd64-compatible.exe'
          dotnet build Platforms/Windows/Desktop/Clay.Windows.csproj -c Release -o $desktop
          if ($LASTEXITCODE -ne 0) { throw "Desktop build failed: $LASTEXITCODE" }
          dotnet (Join-Path $desktop 'Clay.Windows.dll') --smoke $binary $fixture
          if ($LASTEXITCODE -ne 0) { throw "Desktop session bridge failed: $LASTEXITCODE" }
          dotnet (Join-Path $desktop 'Clay.Windows.dll') --smoke-pac $binary
          if ($LASTEXITCODE -ne 0) { throw "Windows system PAC check failed: $LASTEXITCODE" }
          dotnet (Join-Path $desktop 'Clay.Windows.dll') --smoke-subscriptions $binary $fixture
          if ($LASTEXITCODE -ne 0) { throw "Windows subscription check failed: $LASTEXITCODE" }
          $packageDir = Join-Path $env:RUNNER_TEMP 'clay-windows-preview'
          $archive = ./scripts/package-windows.ps1 -DesktopBuild $desktop -PortableExe $binary -OutputDirectory $packageDir
          $unpacked = Join-Path $env:RUNNER_TEMP 'clay-windows-unpacked'
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked
          dotnet (Join-Path $unpacked 'Clay.Windows.dll') --smoke (Join-Path $unpacked 'clay-portable.exe') $fixture
          if ($LASTEXITCODE -ne 0) { throw "Extracted Windows package failed: $LASTEXITCODE" }
      - name: Upload the verified Windows preview
        if: github.event_name == 'push'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: CLAY-Windows-x64-preview
          path: ${{ runner.temp }}/clay-windows-preview/
          if-no-files-found: error
          retention-days: 14
