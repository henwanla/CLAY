name: Linux portable CLI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Build portable CLI
        run: |
          swift --version
          swift build -c release --product clay-portable
      - name: Run synthetic CLI checks
        run: python3 scripts/smoke-portable.py .build/release/clay-portable
      - name: Verify foreground runtime and loopback ownership
        run: python3 scripts/smoke-linux-runtime.py .build/release/clay-portable
      - name: Install GTK test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 dbus-daemon xvfb xauth gsettings-desktop-schemas dconf-gsettings-backend dconf-service libglib2.0-bin
      - name: Exercise GTK, the tray and GNOME proxy in isolated settings
        run: bash Platforms/Linux/smoke-gnome.sh .build/release/clay-portable
