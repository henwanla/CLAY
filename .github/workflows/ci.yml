name: macOS checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Check source for local credentials
        run: python3 scripts/check-source-privacy.py
      - name: Check README PNGs for extra metadata
        run: python3 scripts/strip-screenshot-metadata.py --check docs/screenshots/*.png
      - name: Build the app and checks
        run: bash scripts/swift-local.sh build -c release
      - name: Check profiles, PAC rules and synthetic recovery
        run: .build/release/CLAYCoreChecks
      - name: Check loopback PAC server
        run: .build/release/CLAYCoreChecks --pac-fixture
      - name: Check subscription downloads
        run: python3 scripts/smoke-subscriptions.py .build/release/CLAYCoreChecks
      - name: Build and verify the public Apple Silicon package
        shell: bash
        run: |
          bash scripts/package-macos.sh --public
          bash scripts/verify-macos-package.sh
      - name: Upload the verified macOS preview
        if: github.event_name == 'push'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: CLAY-macOS-arm64-preview
          path: dist/release/CLAY-*-macos-arm64.zip*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
